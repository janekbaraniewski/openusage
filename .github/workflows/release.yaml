name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release (Linux & Windows)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cross-compilation toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            gcc-aarch64-linux-gnu \
            gcc-mingw-w64-x86-64

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Generate provider icon font
        run: |
          python -m pip install --quiet --require-hashes -r scripts/requirements-icon-font.txt
          python scripts/gen-icon-font.py
          git diff --exit-code internal/tmux/assets/openusage-icons.ttf \
            || (echo "::error::committed icon font is stale; run 'make icon-font' and commit" && exit 1)

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: /tmp/openusage-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SPDX SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sbom="dist/openusage_${GITHUB_REF_NAME}.sbom.spdx.json"
          cp "/tmp/openusage-${GITHUB_REF_NAME}.spdx.json" "$sbom"
          gh release upload "${GITHUB_REF_NAME}" "$sbom" --clobber

      - name: Generate SLSA provenance
        id: attest-release
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Upload SLSA provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          provenance="dist/openusage_${GITHUB_REF_NAME}.intoto.jsonl"
          cp "${{ steps.attest-release.outputs.bundle-path }}" "$provenance"
          gh release upload "${GITHUB_REF_NAME}" "$provenance" --clobber

  release-macos:
    name: Release (macOS binaries)
    runs-on: macos-latest
    needs: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build macOS amd64
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w \
            -X 'github.com/janekbaraniewski/openusage/internal/version.Version=${{ steps.version.outputs.version }}' \
            -X 'github.com/janekbaraniewski/openusage/internal/version.CommitHash=$(git rev-parse --short HEAD)' \
            -X 'github.com/janekbaraniewski/openusage/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o dist/openusage_darwin_amd64 ./cmd/openusage

      - name: Build macOS arm64
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -ldflags="-s -w \
            -X 'github.com/janekbaraniewski/openusage/internal/version.Version=${{ steps.version.outputs.version }}' \
            -X 'github.com/janekbaraniewski/openusage/internal/version.CommitHash=$(git rev-parse --short HEAD)' \
            -X 'github.com/janekbaraniewski/openusage/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o dist/openusage_darwin_arm64 ./cmd/openusage

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create macOS archives
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cd dist

          mkdir -p openusage_${VERSION}_darwin_amd64
          cp openusage_darwin_amd64 openusage_${VERSION}_darwin_amd64/openusage
          cp ../configs/example_settings.json openusage_${VERSION}_darwin_amd64/
          [ -f ../LICENSE* ] && cp ../LICENSE* openusage_${VERSION}_darwin_amd64/ || true
          [ -f ../README* ] && cp ../README* openusage_${VERSION}_darwin_amd64/ || true
          tar czf openusage_${VERSION}_darwin_amd64.tar.gz openusage_${VERSION}_darwin_amd64

          mkdir -p openusage_${VERSION}_darwin_arm64
          cp openusage_darwin_arm64 openusage_${VERSION}_darwin_arm64/openusage
          cp ../configs/example_settings.json openusage_${VERSION}_darwin_arm64/
          [ -f ../LICENSE* ] && cp ../LICENSE* openusage_${VERSION}_darwin_arm64/ || true
          [ -f ../README* ] && cp ../README* openusage_${VERSION}_darwin_arm64/ || true
          tar czf openusage_${VERSION}_darwin_arm64.tar.gz openusage_${VERSION}_darwin_arm64

      - name: Generate SLSA provenance
        id: attest-macos
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Materialize SLSA provenance
        run: cp "${{ steps.attest-macos.outputs.bundle-path }}" "dist/openusage_${GITHUB_REF_NAME}_darwin.intoto.jsonl"

      - name: Sign macOS archives with cosign (keyless)
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cd dist
          for arch in amd64 arm64; do
            archive="openusage_${VERSION}_darwin_${arch}.tar.gz"
            cosign sign-blob --yes \
              --bundle "${archive}.sigstore.json" \
              "${archive}"
          done

      - name: Upload macOS binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          chmod +x scripts/install.sh
          gh release upload "${GITHUB_REF_NAME}" \
            dist/openusage_${VERSION}_darwin_amd64.tar.gz \
            dist/openusage_${VERSION}_darwin_amd64.tar.gz.sigstore.json \
            dist/openusage_${VERSION}_darwin_arm64.tar.gz \
            dist/openusage_${VERSION}_darwin_arm64.tar.gz.sigstore.json \
            dist/openusage_${GITHUB_REF_NAME}_darwin.intoto.jsonl \
            scripts/install.sh \
            --clobber

  update-homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: [release, release-macos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for release assets to be available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          for i in $(seq 1 30); do
            ASSETS=$(gh release view "${GITHUB_REF_NAME}" --json assets -q '.assets[].name' 2>/dev/null || true)
            if echo "$ASSETS" | grep -q "darwin_arm64.tar.gz" && \
               echo "$ASSETS" | grep -q "darwin_amd64.tar.gz" && \
               echo "$ASSETS" | grep -q "linux_amd64.tar.gz" && \
               echo "$ASSETS" | grep -q "linux_arm64.tar.gz"; then
              echo "All release assets found."
              exit 0
            fi
            echo "Waiting for release assets... attempt $i/30"
            sleep 10
          done
          echo "Timed out waiting for release assets"
          exit 1

      - name: Download release assets and compute checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p /tmp/release-assets
          cd /tmp/release-assets

          gh release download "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --pattern "openusage_${VERSION}_darwin_amd64.tar.gz" \
            --pattern "openusage_${VERSION}_darwin_arm64.tar.gz" \
            --pattern "openusage_${VERSION}_linux_amd64.tar.gz" \
            --pattern "openusage_${VERSION}_linux_arm64.tar.gz"

          echo "SHA_DARWIN_AMD64=$(sha256sum openusage_${VERSION}_darwin_amd64.tar.gz | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "SHA_DARWIN_ARM64=$(sha256sum openusage_${VERSION}_darwin_arm64.tar.gz | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "SHA_LINUX_AMD64=$(sha256sum openusage_${VERSION}_linux_amd64.tar.gz | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "SHA_LINUX_ARM64=$(sha256sum openusage_${VERSION}_linux_arm64.tar.gz | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Generate Homebrew formula
        run: |
          VERSION=${{ steps.version.outputs.version }}
          REPO="achappell/openusage"
          BASE_URL="https://github.com/${REPO}/releases/download/v${VERSION}"

          mkdir -p /tmp/homebrew-formula

          cat > /tmp/homebrew-formula/openusage.rb << FORMULA
          # typed: false
          # frozen_string_literal: true

          class Openusage < Formula
            desc "Monitor your AI coding tool quotas from a single TUI dashboard"
            homepage "https://openusage.sh"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/openusage_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "${BASE_URL}/openusage_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE_URL}/openusage_${VERSION}_linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "${BASE_URL}/openusage_${VERSION}_linux_amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install "openusage"
            end

            def caveats
              <<~EOS
                If \`openusage\` is missing after an install or upgrade, the keg is
                installed but unlinked. There are two known causes.

                1. Tap trust. Homebrew 6.0+ requires third-party taps to be trusted,
                   and a trust grant only covers the formula version it was made for,
                   so each \`brew update\` that bumps openusage can leave the keg
                   unlinked. Trust the whole tap once to keep it linked across
                   upgrades:

                     brew trust achappell/tap

                   See https://docs.brew.sh/Tap-Trust for details.

                2. Tap ambiguity. If another installed tap also defines a formula
                   named "openusage", Homebrew cannot resolve the bare name and
                   skips the link step. Check with:

                     brew info --formula openusage

                   An error reading "Formulae found in multiple taps" confirms it.
                   Remove the tap you do not use, or always use the fully-qualified
                   name.

                Either way, this restores the command immediately:

                  brew link achappell/tap/openusage
              EOS
            end

            test do
              assert_match "openusage", shell_output("#{bin}/openusage --version 2>&1", 0)
            end
          end
          FORMULA

          sed -i 's/^          //' /tmp/homebrew-formula/openusage.rb

      - name: Configure Homebrew tap SSH access
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          test -n "${HOMEBREW_TAP_DEPLOY_KEY}" || {
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not configured"
            exit 1
          }
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${HOMEBREW_TAP_DEPLOY_KEY}" > "${HOME}/.ssh/homebrew-tap-deploy-key"
          chmod 600 "${HOME}/.ssh/homebrew-tap-deploy-key"
          ssh-keyscan -H github.com >> "${HOME}/.ssh/known_hosts"

      - name: Push formula to Homebrew tap
        run: |
          export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/homebrew-tap-deploy-key -o IdentitiesOnly=yes"
          git clone --branch master "git@github.com:achappell/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Formula
          cp /tmp/homebrew-formula/openusage.rb /tmp/homebrew-tap/Formula/openusage.rb

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/openusage.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update openusage to ${{ steps.version.outputs.version }}"
          git push
